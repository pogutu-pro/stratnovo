<!doctype html>
<html lang="en">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />

    <!-- `viewport-fit=cover` lets the layout use the full screen on notched
         devices; the CSS then pads around the safe-area insets. Zoom stays
         enabled (no `user-scalable=no`) for accessibility. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>StratNovo — Technology, Growth, Learning &amp; Property</title>
    <meta
      name="description"
      content="StratNovo builds digital products, software systems, growth experiences, learning platforms, and property solutions for people and businesses ready to move forward."
    />
    <meta name="theme-color" content="#F7F5EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171716" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StratNovo" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StratNovo" />
    <meta property="og:title" content="StratNovo — Technology, Growth, Learning &amp; Property" />
    <meta
      property="og:description"
      content="Ideas are cheap. Execution is the product. We build, grow, teach, and manage — across software, digital marketing, learning, and property."
    />
    <meta property="og:image" content="/favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="StratNovo" />
    <meta
      name="twitter:description"
      content="Ideas are cheap. Execution is the product."
    />

    <!-- Warm up DNS/TLS for the font and image origins before CSS/JS run.
         Fonts are loaded via <link> rather than a CSS @import so they do not
         serialise behind the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
    />
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
